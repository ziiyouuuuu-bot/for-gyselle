    <!-- face head outline and face -->
    <path class="o" d="M116 220h92v10h14v18h10v76h-10v18h-14v14h-92v-14h-14v-18h-10v-76h10v-18h14z"/>
    <path class="s" d="M116 236h92v10h14v70h-14v18h-14v12h-64v-12h-14v-18h-14v-70h14z"/>
    <!-- side sweep fringe -->
    <path class="h" d="M110 234h12v-10h78v10h14v16h8v26h-16v-14h-20v16h-18v-14h-18v12h-40z"/>
    <rect class="hl" x="126" y="238" width="20" height="8"/>
