<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Chibi pixel character sheet, version two</title>
  <desc id="desc">Four cute big-headed pixel characters: two friends at school and at age nineteen.</desc>
  <defs>
    <style>
      .o{fill:#3b303a}.h{fill:#29252d}.hl{fill:#51404e}.s{fill:#e9b493}.sh{fill:#cc8273}.e{fill:#5a3652}.w{fill:#fff9fb}.b{fill:#327bca}.bs{fill:#225a9e}.g{fill:#214a3c}.k{fill:#24232a}.d{fill:#28486f}.dl{fill:#3b628f}.p{fill:#f18fae}.l{font:700 19px monospace;fill:#3b303a;letter-spacing:1px}.t{font:15px monospace;fill:#71616e}
    </style>
    <pattern id="checks" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fffafd"/><rect width="8" height="8" fill="#f7eaf1"/><rect x="8" y="8" width="8" height="8" fill="#f7eaf1"/></pattern>
  </defs>
  <rect width="1200" height="720" fill="#e9dce6"/>
  <rect x="30" y="28" width="1140" height="664" rx="24" fill="url(#checks)" stroke="#3b303a" stroke-width="5"/>
  <text x="66" y="78" class="l">PIXEL BESTIES · CHIBI STUDY</text>
  <path d="M64 102H1136" stroke="#3b303a" stroke-width="4"/>

  <!-- four mini cards -->
  <g><rect x="74" y="140" width="246" height="476" rx="18" fill="#e0edff" stroke="#3b303a" stroke-width="4"/><text x="96" y="178" class="l">17</text><text x="96" y="594" class="t">FRIEND · SCHOOL</text></g>
  <g><rect x="350" y="140" width="246" height="476" rx="18" fill="#e0edff" stroke="#3b303a" stroke-width="4"/><text x="372" y="178" class="l">17</text><text x="372" y="594" class="t">YOU · SCHOOL</text></g>
  <g><rect x="626" y="140" width="246" height="476" rx="18" fill="#f3e5f1" stroke="#3b303a" stroke-width="4"/><text x="648" y="178" class="l">19</text><text x="648" y="594" class="t">YOU · NOW</text></g>
  <g><rect x="902" y="140" width="246" height="476" rx="18" fill="#f3e5f1" stroke="#3b303a" stroke-width="4"/><text x="924" y="178" class="l">19</text><text x="924" y="594" class="t">FRIEND · NOW</text></g>

