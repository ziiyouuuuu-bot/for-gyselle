    <rect class="e" x="974" y="294" width="16" height="18"/><rect class="w" x="978" y="298" width="6" height="7"/><rect class="e" x="1030" y="294" width="16" height="18"/><rect class="w" x="1034" y="298" width="6" height="7"/><rect class="p" x="962" y="318" width="18" height="8"/><rect class="p" x="1040" y="318" width="18" height="8"/><rect class="e" x="1004" y="324" width="12" height="5"/>
