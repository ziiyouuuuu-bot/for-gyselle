    <path class="o" d="M696 350h64v10h12v80h-88v-80h12z"/><path class="k" d="M692 366h72v66h-72z"/><path class="s" d="M696 350h18v8h28v-8h18v16h-64z"/><rect class="s" x="674" y="374" width="18" height="46"/><rect class="s" x="764" y="374" width="18" height="46"/>
    <!-- cute flares -->
    <path class="o" d="M702 432h26v54l-12 12h-30l10-26v-40zm34 0h26v40l10 26h-30l-12-12z"/><path class="d" d="M706 440h14v34l-10 16h-18l14-24zm38 0h14v26l14 24h-18l-10-16z"/><rect class="o" x="686" y="490" width="32" height="10"/><rect class="o" x="750" y="490" width="32" height="10"/>
  </g>

  <!-- friend at 19: visibly longer hair, sleeveless top + puff skirt -->
  <g aria-label="Chibi friend at nineteen">
    <path class="o" d="M954 218h100v12h10v162h-22v-50h-76v50h-22V230h10z"/><path class="h" d="M962 224h84v14h10v146h-16v-50h-72v50h-16V238h10z"/>
    <path class="o" d="M958 228h92v10h14v18h10v74h-10v18h-14v14h-92v-14h-14v-18h-10v-74h10v-18h14z"/><path class="s" d="M958 244h92v10h14v68h-14v18h-14v12h-64v-12h-14v-18h-14v-68h14z"/>
