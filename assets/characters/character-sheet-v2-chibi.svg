    <rect class="e" x="698" y="282" width="16" height="18"/><rect class="w" x="702" y="286" width="6" height="7"/><rect class="e" x="754" y="282" width="16" height="18"/><rect class="w" x="758" y="286" width="6" height="7"/><rect class="p" x="686" y="306" width="18" height="8"/><rect class="p" x="764" y="306" width="18" height="8"/><rect class="e" x="728" y="312" width="12" height="5"/>
