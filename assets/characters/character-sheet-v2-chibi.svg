    <rect class="s" x="386" y="374" width="18" height="48"/><rect class="s" x="476" y="374" width="18" height="48"/><rect class="s" x="416" y="442" width="18" height="44"/><rect class="s" x="446" y="442" width="18" height="44"/><rect class="o" x="408" y="482" width="30" height="12"/><rect class="o" x="442" y="482" width="30" height="12"/>
  </g>

