    <rect class="s" x="110" y="384" width="18" height="46"/><rect class="s" x="200" y="384" width="18" height="46"/>
    <rect class="s" x="140" y="448" width="18" height="38"/><rect class="s" x="170" y="448" width="18" height="38"/><rect class="o" x="132" y="482" width="30" height="12"/><rect class="o" x="166" y="482" width="30" height="12"/>
  </g>

