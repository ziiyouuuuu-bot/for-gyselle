    <path class="o" d="M972 362h64v10h12v68h-88v-68h12z"/><path class="k" d="M968 374h72v58h-72z"/><rect class="k" x="972" y="354" width="16" height="22"/><rect class="k" x="1020" y="354" width="16" height="22"/><rect class="s" x="950" y="380" width="18" height="40"/><rect class="s" x="1040" y="380" width="18" height="40"/>
    <path class="o" d="M966 430h76l18 18-10 36h-92l-10-36z"/><path class="k" d="M970 438h68l14 14-8 24h-80l-8-24z"/><rect class="sh" x="966" y="468" width="76" height="6"/>
    <rect class="s" x="980" y="484" width="18" height="22"/><rect class="s" x="1010" y="484" width="18" height="22"/><rect class="o" x="972" y="502" width="30" height="10"/><rect class="o" x="1006" y="502" width="30" height="10"/>
